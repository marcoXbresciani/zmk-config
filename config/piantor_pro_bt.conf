# ── Battery life ────────────────────────────────────────────────────────────
# Turn off BLE/display after 30 s idle.
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Deep sleep after 15 min idle — maximum battery saving.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# ── Bluetooth identity ───────────────────────────────────────────────────────
# Name shown in the host OS Bluetooth manager (max 16 characters).
# Does NOT appear on the nice!view display — that shows layer names only.
# TODO: decide on a name.
CONFIG_ZMK_KEYBOARD_NAME="Piantor Pro (MB)"

CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
